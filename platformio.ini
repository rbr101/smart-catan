; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev  ; This sets esp32dev as the default environment

; Common settings that apply to all environments
[common]
; [env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.4
	bblanchon/ArduinoJson@^7.3.0

; Default environment - Home Assistant is toggled via ENABLE_HOME_ASSISTANT
; in include/password.h (see extra_script.py)
[env:esp32dev]
extends = common
extra_scripts = pre:extra_script.py

; Environment without Home Assistant, regardless of password.h
[env:esp32dev-no-ha]
extends = common
extra_scripts = pre:extra_script.py