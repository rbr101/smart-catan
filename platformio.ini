; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev  ; This sets esp32dev as the default environment

; Common settings that apply to all environments
[common]
; [env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; This board (ESP32-C3 SuperMini) has no separate USB-UART bridge chip; the
; USB port only reaches the chip's native USB peripheral. These flags make
; the Arduino "Serial" object use that native USB CDC instead of the
; unconnected UART0 pins, so Serial.print() actually reaches the monitor.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.4
	bblanchon/ArduinoJson@^7.3.0

; Home Assistant integration is always compiled in and toggled at runtime
; (from the web UI, persisted in flash) rather than at build time; see
; lib/HomeAssistant/HomeAssistantTrigger.cpp.
[env:esp32dev]
extends = common